services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_DB: moviemanager_test
      POSTGRES_USER: tester
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tester -d moviemanager_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  tests:
    build:
      context: .
      target: test
    environment:
      DB_HOST: db-test
      DB_NAME: moviemanager_test
      DB_USER: tester
      DB_PASSWORD: test-only-password
    depends_on:
      db-test:
        condition: service_healthy
